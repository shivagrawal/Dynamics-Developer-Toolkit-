name: Dataverse On-demand SQL Test Harness

on:
  push:
    branches:
      - feature/sql4cds-query-studio
    paths:
      - ".github/workflows/dataverse-on-demand-query.yml"
      - "tests/query-studio/on-demand-query.mjs"
      - "sqlstudio/js/sql-engine.js"
      - "background.js"
      - "security-audit-service.js"
      - "ui/sql-studio-view.js"
  workflow_dispatch:
    inputs:
      sql_query:
        description: "Read-only SQL query. Must use SELECT TOP N (N 1–25); only account/contact/systemuser tables. Do not enter sensitive values."
        required: true
        type: string
        default: "SELECT TOP 25 systemuserid, fullname FROM systemuser WHERE fullname LIKE '%dataverse%' ORDER BY systemuserid"

permissions:
  contents: read

jobs:
  run-query:
    name: Run bounded read-only SQL query
    runs-on: ubuntu-latest
    environment: dataverse-test
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/sql4cds-query-studio

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate configuration and run query
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          SQL_QUERY: ${{ inputs.sql_query || 'SELECT TOP 25 systemuserid, fullname FROM systemuser WHERE fullname LIKE ''%dataverse%'' ORDER BY systemuserid' }}
        run: node tests/query-studio/on-demand-query.mjs

      - name: Publish live SQL smoke-test checkpoint
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Dataverse live SQL checkpoint"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Job result: **$JOB_STATUS**"
            echo "- Environment: dataverse-test"
            echo "- The harness checks both FetchXML and native SQL endpoint paths; row values and credentials are not logged."
          } >> "$GITHUB_STEP_SUMMARY"
