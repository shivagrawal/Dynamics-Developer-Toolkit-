name: Query Studio Regression Tests

on:
  push:
    branches:
      - feature/sql4cds-query-studio
  pull_request:
    branches:
      - main
      - feature/sql4cds-query-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-studio-regression:
    name: Query Studio regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check security-audit-service.js
          node --check ui/sql-studio-view.js
          node --check sqlstudio/js/sql-front-end.js
          node --check sqlstudio/js/sql-engine.js
          node --check tests/query-studio/on-demand-query.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"

      - name: Run Query Studio regression suite
        run: node --test tests/query-studio/sql-engine.test.mjs tests/query-studio/sql-front-end.test.mjs tests/query-studio/query-studio-regression.test.mjs tests/query-studio/security-query-corpus.test.mjs tests/query-studio/security-query-adapter.test.mjs tests/query-studio/security-sql-routing.test.mjs tests/query-studio/sql-studio-ui.test.mjs

      - name: Publish durable iteration checkpoint
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Query Studio regression checkpoint"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Job result: **$JOB_STATUS**"
            echo "- Syntax validation includes the live SQL harness."
            echo "- Full regression suite command is recorded in the preceding step."
          } >> "$GITHUB_STEP_SUMMARY"
