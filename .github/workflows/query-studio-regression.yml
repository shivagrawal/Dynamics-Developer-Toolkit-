name: Query Studio Regression Tests

on:
  push:
    branches:
      - feature/sql4cds-query-studio
  pull_request:
    branches:
      - main
      - feature/sql4cds-query-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-studio-regression:
    name: Query Studio regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check ui/sql-studio-view.js
          node --check sqlstudio/js/sql-front-end.js
          node --check sqlstudio/js/sql-engine.js
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"

      - name: Run Query Studio regression suite
        run: node --test tests/query-studio/sql-engine.test.mjs tests/query-studio/sql-front-end.test.mjs tests/query-studio/query-studio-regression.test.mjs tests/query-studio/security-query-corpus.test.mjs
